<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>悪ノリ読み上げ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="読み上げ">
<meta name="theme-color" content="#f1efff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* layout: a stage on top (text + one huge speak button), knobs below, then the board of saved buttons */
:root{
  --bg:#f1efff; --panel:#ffffff; --ink:#1a1630; --muted:#5d5878; --line:#d9d4f2;
  --hot:#ff5a36; --hot-ink:#ffffff; --cool:#2a4cff; --soft:#e5e1ff;
  --f-display:"Dela Gothic One","Hiragino Sans",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141220; --panel:#1e1b2e; --ink:#efecff; --muted:#a6a0c4; --line:#353050;
  --hot:#ff6e4d; --hot-ink:#1a0d08; --cool:#8ea0ff; --soft:#2a2642; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:grid;gap:16px}
h1{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.2;margin:0;letter-spacing:.02em}
h1 small{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);letter-spacing:0;margin-top:4px}
.stage{background:var(--panel);border:2px solid var(--ink);border-radius:18px;padding:12px;display:grid;gap:10px;box-shadow:5px 5px 0 var(--ink)}
textarea{width:100%;min-height:84px;border:0;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:18px;resize:vertical}
.speak{display:flex;align-items:center;justify-content:center;gap:10px;height:72px;border:2px solid var(--ink);border-radius:14px;background:var(--hot);color:var(--hot-ink);font-family:var(--f-display);font-size:26px;letter-spacing:.06em;box-shadow:0 5px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.speak:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.speak.talking{background:var(--cool);color:#fff}
.row2{display:grid;grid-template-columns:1fr auto;gap:8px}
.ghost{border:2px solid var(--ink);background:var(--panel);border-radius:12px;padding:8px 14px;font-weight:700}
.presets{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.presets button{flex:none;border:2px solid var(--ink);background:var(--panel);border-radius:999px;padding:6px 14px;font-weight:700;white-space:nowrap}
.presets button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.knobs{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:12px}
.knob{display:grid;grid-template-columns:4.5em 1fr 3.2em;align-items:center;gap:10px}
.knob label{font-size:14px;color:var(--muted)}
.knob output{font-variant-numeric:tabular-nums;text-align:right;font-size:14px}
input[type=range]{width:100%;accent-color:var(--hot)}
select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px}
.hint{font-size:12px;color:var(--muted);margin:0}
h2{font-family:var(--f-display);font-weight:400;font-size:19px;margin:6px 0 0}
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pad{position:relative;min-height:84px;border:2px solid var(--ink);border-radius:14px;background:var(--panel);padding:10px 12px;text-align:left;display:grid;align-content:space-between;gap:6px;box-shadow:0 4px 0 var(--ink);transition:transform .06s,box-shadow .06s;min-width:0}
.pad:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.pad .t{font-weight:700;overflow-wrap:anywhere;line-height:1.35}
.pad .m{font-size:11px;color:var(--muted)}
.pad.c1{background:#ffe1d8}.pad.c2{background:#dfe5ff}.pad.c3{background:#fff2c2}.pad.c4{background:#dff5e6}
@media (prefers-color-scheme:dark){.pad.c1{background:#40231c}.pad.c2{background:#232a52}.pad.c3{background:#3d3418}.pad.c4{background:#1c3626}}
.pad.talking{outline:3px solid var(--hot);outline-offset:2px}
.edit .pad::after{content:"×";position:absolute;top:-10px;right:-10px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 16px;font-size:14px;max-width:calc(100% - 32px);text-align:center;z-index:5}
.empty{grid-column:1/-1;border:2px dashed var(--line);border-radius:14px;padding:16px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.speak,.pad{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>悪ノリ読み上げ<small>文を打って、声をいじって、喋らせる。気に入ったらボタンにして保存。</small></h1>

  <section class="stage" aria-label="喋らせる">
    <textarea id="text" aria-label="喋らせる文" placeholder="ここに喋らせたい文を打つ">塩をかけるのだけは、やめてもらっていいですか</textarea>
    <button id="speak" class="speak" type="button">喋る</button>
    <div class="row2">
      <div class="presets" role="group" aria-label="声のプリセット" id="presets"></div>
    </div>
  </section>

  <section class="knobs" aria-label="声の設定">
    <div class="knob"><label for="pitch">高さ</label><input id="pitch" type="range" min="0" max="2" step="0.05" value="1"><output id="pitchV">1.00</output></div>
    <div class="knob"><label for="rate">速さ</label><input id="rate" type="range" min="0.3" max="2.5" step="0.05" value="1"><output id="rateV">1.00</output></div>
    <div class="knob"><label for="times">連呼</label><input id="times" type="range" min="1" max="8" step="1" value="1"><output id="timesV">1回</output></div>
    <div class="knob"><label for="gap">間</label><input id="gap" type="range" min="0" max="1500" step="50" value="150"><output id="gapV">0.15秒</output></div>
    <div><label for="voice" class="hint">声の種類(英語の声に日本語を読ませるとカタコトになる)</label><select id="voice"></select></div>
    <p class="hint">音が出ないときは、iPhoneの横のスイッチ(消音モード)を確認してね。</p>
  </section>

  <div class="bar">
    <button id="save" class="ghost" type="button">ボタンにして保存</button>
    <button id="share" class="ghost" type="button">友達に送るリンク</button>
    <button id="editBtn" class="ghost" type="button" aria-pressed="false">消す</button>
  </div>

  <h2>マイボタン</h2>
  <div id="board" class="board"></div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const synth = window.speechSynthesis;
const PRESETS = [
  { name: "ふつう", pitch: 1, rate: 1 },
  { name: "ヘリウム", pitch: 2, rate: 1.35 },
  { name: "低音ボス", pitch: 0.1, rate: 0.75 },
  { name: "ロボ", pitch: 0.5, rate: 0.85, times: 1, lang: "en" },
  { name: "早口", pitch: 1.2, rate: 2.2 },
  { name: "眠い", pitch: 0.6, rate: 0.45 },
  { name: "連呼", pitch: 1.1, rate: 1.3, times: 5, gap: 0 },
  { name: "カタコト", pitch: 1, rate: 0.95, lang: "en" },
];
const SAMPLES = [
  { text: "なめくじ界隈、ざわつく", pitch: 0.2, rate: 0.8 },
  { text: "えっ、今の聞いた？", pitch: 1.8, rate: 1.4 },
  { text: "本日の私、無敵", pitch: 1, rate: 1.1, times: 3, gap: 100 },
  { text: "会議を始めます。始まりません。", pitch: 0.5, rate: 0.85, lang: "en" },
];
let voices = [], editMode = false;

// ---------- storage ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem("yomi." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("yomi." + k, JSON.stringify(v)); } catch (e) {} },
};
let pads = store.get("pads", null) || SAMPLES.map((s, i) => ({ ...s, id: Date.now() + i }));

// ---------- voices ----------
function loadVoices() {
  voices = synth ? synth.getVoices() : [];
  const sel = $("voice"), cur = sel.value;
  const ja = voices.filter(v => /^ja/i.test(v.lang)), other = voices.filter(v => !/^ja/i.test(v.lang));
  const opt = v => `<option value="${esc(v.voiceURI)}">${esc(v.name)}(${esc(v.lang)})</option>`;
  sel.innerHTML = `<option value="">おまかせ(日本語)</option>` +
    (ja.length ? `<optgroup label="日本語">${ja.map(opt).join("")}</optgroup>` : "") +
    (other.length ? `<optgroup label="ほかの言語">${other.map(opt).join("")}</optgroup>` : "");
  if (cur) sel.value = cur;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function pickVoice(p) {
  if (p.voice) { const v = voices.find(x => x.voiceURI === p.voice); if (v) return v; }
  if (p.lang === "en") return voices.find(v => /^en-US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang)) || null;
  return voices.find(v => /^ja/i.test(v.lang)) || null;
}

// ---------- speaking ----------
let speakingEl = null;
function speak(p, el) {
  if (!synth) { toast("このブラウザは読み上げに対応していません"); return; }
  const text = (p.text || "").trim();
  if (!text) { toast("先に文を打ってね"); return; }
  synth.cancel();
  if (speakingEl) speakingEl.classList.remove("talking");
  speakingEl = el || null;
  const times = Math.max(1, Math.min(8, p.times || 1)), gap = p.gap ?? 150;
  let n = 0;
  const one = () => {
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(p);
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = p.lang === "en" ? "en-US" : "ja-JP";
    u.pitch = p.pitch ?? 1; u.rate = p.rate ?? 1;
    u.onend = () => { n++; if (n < times) setTimeout(one, gap); else done(); };
    u.onerror = done;
    synth.speak(u);
  };
  const done = () => { if (speakingEl) speakingEl.classList.remove("talking"); $("speak").classList.remove("talking"); speakingEl = null; };
  if (el) el.classList.add("talking");
  one();
}
function current() {
  return { text: $("text").value, pitch: +$("pitch").value, rate: +$("rate").value, times: +$("times").value, gap: +$("gap").value, voice: $("voice").value || undefined, lang: currentLang };
}
let currentLang = undefined;

// ---------- knobs & presets ----------
function syncOut() {
  $("pitchV").textContent = (+$("pitch").value).toFixed(2);
  $("rateV").textContent = (+$("rate").value).toFixed(2);
  $("timesV").textContent = $("times").value + "回";
  $("gapV").textContent = (+$("gap").value / 1000).toFixed(2) + "秒";
}
function applySettings(p) {
  $("pitch").value = p.pitch ?? 1; $("rate").value = p.rate ?? 1; $("times").value = p.times ?? 1; $("gap").value = p.gap ?? 150;
  currentLang = p.lang;
  $("voice").value = p.voice || "";
  if (p.lang === "en" && !p.voice) { const v = pickVoice(p); if (v) $("voice").value = v.voiceURI; }
  syncOut();
}
function renderPresets() {
  $("presets").innerHTML = PRESETS.map((p, i) => `<button type="button" data-i="${i}" aria-pressed="${i === 0}">${p.name}</button>`).join("");
}
$("presets").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  for (const x of $("presets").children) x.setAttribute("aria-pressed", String(x === b));
  applySettings(PRESETS[+b.dataset.i]);
  speak(current(), null);
});
for (const id of ["pitch", "rate", "times", "gap"]) $(id).addEventListener("input", syncOut);
$("voice").addEventListener("change", () => { currentLang = undefined; });
$("speak").onclick = () => { $("speak").classList.add("talking"); speak(current(), null); };

// ---------- board ----------
function renderBoard() {
  const b = $("board");
  b.classList.toggle("edit", editMode);
  if (!pads.length) { b.innerHTML = `<div class="empty">まだボタンがありません。上で喋らせて「ボタンにして保存」。</div>`; return; }
  b.innerHTML = pads.map((p, i) => {
    const meta = [`高さ${(p.pitch ?? 1).toFixed(1)}`, `速さ${(p.rate ?? 1).toFixed(1)}`, (p.times || 1) > 1 ? `${p.times}連` : "", p.lang === "en" ? "カタコト" : ""].filter(Boolean).join(" · ");
    return `<button type="button" class="pad c${(i % 4) + 1}" data-id="${p.id}" aria-label="${esc(p.text)}${editMode ? "を消す" : "を喋らせる"}"><span class="t">${esc(p.text)}</span><span class="m">${meta}</span></button>`;
  }).join("");
}
$("board").addEventListener("click", e => {
  const el = e.target.closest(".pad"); if (!el) return;
  const p = pads.find(x => String(x.id) === el.dataset.id); if (!p) return;
  if (editMode) { pads = pads.filter(x => x !== p); store.set("pads", pads); renderBoard(); toast("消しました"); return; }
  speak(p, el);
});
// 長押しで、そのボタンの設定を上に読み込む
let pressT = null;
$("board").addEventListener("pointerdown", e => {
  const el = e.target.closest(".pad"); if (!el || editMode) return;
  pressT = setTimeout(() => {
    const p = pads.find(x => String(x.id) === el.dataset.id); if (!p) return;
    $("text").value = p.text; applySettings(p); synth && synth.cancel(); toast("上に読み込みました。いじって保存し直せます"); window.scrollTo({ top: 0, behavior: "smooth" });
  }, 600);
});
for (const ev of ["pointerup", "pointerleave", "pointercancel"]) $("board").addEventListener(ev, () => clearTimeout(pressT));
$("board").addEventListener("contextmenu", e => e.preventDefault());

$("save").onclick = () => {
  const p = current(); if (!p.text.trim()) { toast("先に文を打ってね"); return; }
  pads.unshift({ ...p, text: p.text.trim(), id: Date.now() }); store.set("pads", pads); renderBoard(); toast("ボタンにしました");
};
$("editBtn").onclick = () => { editMode = !editMode; $("editBtn").setAttribute("aria-pressed", String(editMode)); $("editBtn").textContent = editMode ? "消し終わった" : "消す"; renderBoard(); };

// ---------- share ----------
function encode(p) {
  const o = { t: p.text.trim(), p: p.pitch, r: p.rate, n: p.times, g: p.gap, l: p.lang === "en" ? "en" : undefined };
  return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decode(s) {
  try { const o = JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))))); return { text: o.t, pitch: o.p, rate: o.r, times: o.n, gap: o.g, lang: o.l }; } catch (e) { return null; }
}
$("share").onclick = async () => {
  const p = current(); if (!p.text.trim()) { toast("先に文を打ってね"); return; }
  const url = location.origin + location.pathname + "#v=" + encode(p);
  try {
    if (navigator.share) { await navigator.share({ title: "悪ノリ読み上げ", text: "これ押してみて", url }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(url); toast("リンクをコピーしました"); }
  catch (e) { prompt("このリンクをコピーしてね", url); }
};
function loadFromHash() {
  const m = location.hash.match(/v=([\w-]+)/); if (!m) return;
  const p = decode(m[1]); if (!p || !p.text) return;
  $("text").value = p.text; applySettings(p);
  toast("届いた声を読み込みました。「喋る」を押してね");
}

// ---------- toast ----------
let toastT = null;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2200); }

// ---------- start ----------
renderPresets(); syncOut(); renderBoard();
if (synth) { loadVoices(); synth.addEventListener?.("voiceschanged", () => { loadVoices(); }); setTimeout(loadVoices, 500); }
loadFromHash();
window.addEventListener("hashchange", loadFromHash);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
